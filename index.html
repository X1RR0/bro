<html lang="uk">
<head>

    <title>Інтерактивна карта України — X1RR0</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
        }
        body {
            background-color: #121212;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Чорний вступний екран */
        #intro-screen {
            position: fixed;
            inset: 0;
            background-color: #000000;
            z-index: 9000;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            text-align: center;
            transition: opacity 0.8s ease;
        }
        #intro-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }
        #intro-text {
            font-size: clamp(1.5rem, 5.5vw, 2.8rem);
            font-weight: 700;
            color: #ffffff;
            opacity: 0;
            filter: blur(0px);
            transform: scale(0.95);
            transition: opacity 1.5s ease, filter 1.4s ease, transform 1.5s ease;
        }
        #intro-text.visible {
            opacity: 1;
            transform: scale(1);
        }
        #intro-text.blur-out {
            opacity: 0;
            filter: blur(18px);
            transform: scale(1.08);
        }

        /* Кнопка пропуску */
        #skip-btn {
            position: fixed;
            bottom: 24px;
            right: 20px;
            z-index: 9999;
            padding: 10px 18px;
            background: rgba(30, 30, 30, 0.9);
            color: #ffffff;
            border: 1px solid #444;
            border-radius: 999px;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
        }
        #skip-btn.hidden {
            display: none;
        }

        /* Верхня панель */
        header {
            background-color: #18181b;
            padding: 12px 16px;
            text-align: center;
            border-bottom: 1px solid #27272a;
            z-index: 10;
        }
        header h1 {
            font-size: 1.15rem;
            margin-bottom: 4px;
        }
        .legend {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
            padding: 8px;
            background-color: #18181b;
            border-bottom: 1px solid #27272a;
            font-size: 0.72rem;
            z-index: 10;
        }
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: #27272a;
            padding: 3px 7px;
            border-radius: 6px;
        }
        .dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
        }
        .reset-btn {
            background: #3f3f46;
            color: #fff;
            border: none;
            padding: 3px 9px;
            border-radius: 6px;
            font-size: 0.72rem;
            cursor: pointer;
        }

        /* Контейнер карти з камерою */
        #viewport {
            flex: 1;
            position: relative;
            width: 100%;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #121212;
        }
        #camera {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
            transform-origin: center center;
        }
        svg {
            width: 96%;
            height: 96%;
            max-width: 950px;
            max-height: 650px;
        }
        .region {
            fill: #27272a;
            stroke: #121212;
            stroke-width: 1.8;
            stroke-linejoin: round;
            cursor: pointer;
            opacity: 0;
            transition: fill 0.25s ease, opacity 0.45s ease;
        }
        .region.shown {
            opacity: 1;
        }
        .region-label {
            fill: #d4d4d8;
            font-size: 11px;
            font-weight: 500;
            text-anchor: middle;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.45s ease;
        }
        .region-label.shown {
            opacity: 1;
        }

        /* Плашка статусу */
        #status-pill {
            position: absolute;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(24, 24, 27, 0.92);
            border: 1px solid #3f3f46;
            padding: 8px 16px;
            border-radius: 999px;
            font-size: 0.85rem;
            white-space: nowrap;
            pointer-events: none;
        }
    </style>
</head>
